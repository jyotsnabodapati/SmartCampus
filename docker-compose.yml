version: '3.8'

services:
  smartcampus:
    build:
      context: .
      dockerfile: Dockerfile
    image: smartcampus:latest
    container_name: smartcampus-service
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - CHROMA_DB_PATH=/app/chroma_db
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - PYTHONIOENCODING=utf-8
    volumes:
      # Persistent vector database volume
      - chroma_data:/app/chroma_db
      # Read-only mount of university knowledge base documents
      - ./data:/app/data:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s

volumes:
  chroma_data:
    driver: local

