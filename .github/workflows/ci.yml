name: SmartCampus RAG-Ops Pipeline

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'bugfix/**'
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================
  # STAGE 1: AUTOMATED TESTING & BENCHMARK SUITE
  # ============================================================
  test:
    name: Run Automated Tests & Benchmarks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]

    env:
      PYTHONIOENCODING: "utf-8"
      TOKENIZERS_PARALLELISM: "false"
      TF_CPP_MIN_LOG_LEVEL: "3"
      TRANSFORMERS_NO_TF: "1"
      USE_TF: "0"
      USE_TORCH: "1"
      HF_HUB_DISABLE_SYMLINKS_WARNING: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Upgrade pip and build tools
        run: |
          python -m pip install --upgrade pip setuptools wheel

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Pytest automated test suite
        run: |
          pytest -v --tb=short -ra > pytest_output.txt 2>&1 || true
          cat pytest_output.txt

      - name: Publish Pytest Log to Step Summary
        if: always()
        run: |
          echo "## 🧪 Pytest Execution Results (Python ${{ matrix.python-version }})" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat pytest_output.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload Pytest Log Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-log-${{ matrix.python-version }}
          path: pytest_output.txt

      - name: Verify Pytest Success
        run: |
          if grep -q "=== FAILURES ===" pytest_output.txt || grep -q "=== ERRORS ===" pytest_output.txt; then
            echo "❌ Tests failed in Pytest suite."
            grep -E "FAILED |ERROR " pytest_output.txt | while read -r line; do
              echo "::error title=Failed Test::$line"
            done
            grep -A 25 "=== FAILURES ===" pytest_output.txt | head -n 25 | while read -r line; do
              echo "::error title=Failure Detail::$line"
            done
            exit 1
          fi
          echo "✅ All tests passed successfully."

      - name: Run 15-question benchmark evaluation suite
        run: |
          python test_rag.py

      - name: Run deployment smoke test
        run: |
          python smoke_test.py

  # ============================================================
  # STAGE 2: DOCKER CONTAINER BUILD & VERIFICATION
  # ============================================================
  docker:
    name: Build & Verify Docker Container
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build local Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: smartcampus:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test container startup & health check in runner
        run: |
          docker run -d --name smartcampus-test -p 8501:8501 smartcampus:test
          echo "Waiting 25 seconds for Streamlit server warmup..."
          sleep 25
          docker ps
          curl -f http://localhost:8501/_stcore/health || exit 1
          echo "Container health check passed!"
          docker stop smartcampus-test
          docker rm smartcampus-test

      - name: Check Docker Hub credentials
        id: check_dockerhub_creds
        run: |
          if [ -n "${{ secrets.DOCKERHUB_USERNAME }}" ] && [ -n "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "has_creds=true" >> $GITHUB_OUTPUT
            echo "Docker Hub credentials detected."
          else
            echo "has_creds=false" >> $GITHUB_OUTPUT
            echo "Docker Hub credentials not configured in GitHub Secrets. Skipping push."
          fi

      - name: Log in to Docker Hub (if credentials provided)
        if: steps.check_dockerhub_creds.outputs.has_creds == 'true' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push to Docker Hub (if credentials provided)
        if: steps.check_dockerhub_creds.outputs.has_creds == 'true' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/smartcampus:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/smartcampus:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================
  # STAGE 3: CONTINUOUS DEPLOYMENT (CD)
  # ============================================================
  deploy:
    name: Continuous Deployment Trigger
    runs-on: ubuntu-latest
    needs: [test, docker]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Check deployment configuration
        id: check_deploy_creds
        run: |
          if [ -n "${{ secrets.DEPLOY_WEBHOOK_URL }}" ]; then
            echo "has_webhook=true" >> $GITHUB_OUTPUT
            echo "Deployment webhook secret detected."
          else
            echo "has_webhook=false" >> $GITHUB_OUTPUT
            echo "No DEPLOY_WEBHOOK_URL found. CD ready pending platform configuration."
          fi

      - name: Trigger Deployment Webhook (Render / Cloud Service)
        if: steps.check_deploy_creds.outputs.has_webhook == 'true'
        run: |
          echo "Triggering deployment webhook..."
          curl -X POST -f "${{ secrets.DEPLOY_WEBHOOK_URL }}"
          echo "Deployment triggered successfully!"
