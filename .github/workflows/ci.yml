name: SmartCampus RAG-Ops Pipeline

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'bugfix/**'
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  # ============================================================
  # STAGE 1: AUTOMATED TESTING & BENCHMARK SUITE
  # ============================================================
  test:
    name: Run Automated Tests & Benchmarks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]

    env:
      PYTHONIOENCODING: "utf-8"
      TOKENIZERS_PARALLELISM: "false"
      TF_CPP_MIN_LOG_LEVEL: "3"
      TRANSFORMERS_NO_TF: "1"
      USE_TF: "0"
      USE_TORCH: "1"
      HF_HUB_DISABLE_SYMLINKS_WARNING: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Upgrade pip and build tools
        run: |
          python -m pip install --upgrade pip setuptools wheel

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m nltk.downloader stopwords

      - name: Run Pytest automated test suite
        run: |
          pytest -v --tb=short -ra

      - name: Run 15-question benchmark evaluation suite
        run: |
          python test_rag.py

      - name: Run deployment smoke test
        run: |
          python smoke_test.py

  # ============================================================
  # STAGE 2: DOCKER CONTAINER BUILD & VERIFICATION
  # ============================================================
  docker:
    name: Build & Verify Docker Container
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build local Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: smartcampus:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test container startup & health check in runner
        run: |
          docker run -d --name smartcampus-test -p 8501:8501 smartcampus:test
          echo "Waiting 25 seconds for Streamlit server warmup..."
          sleep 25
          docker ps
          curl -f http://localhost:8501/_stcore/health || exit 1
          echo "Container health check passed!"
          docker stop smartcampus-test
          docker rm smartcampus-test

      - name: Check Docker Hub credentials
        id: check_dockerhub_creds
        run: |
          if [ -n "${{ secrets.DOCKERHUB_USERNAME }}" ] && [ -n "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "has_creds=true" >> $GITHUB_OUTPUT
            echo "Docker Hub credentials detected."
          else
            echo "has_creds=false" >> $GITHUB_OUTPUT
            echo "Docker Hub credentials not configured in GitHub Secrets. Skipping push."
          fi

      - name: Log in to Docker Hub (if credentials provided)
        if: steps.check_dockerhub_creds.outputs.has_creds == 'true' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push to Docker Hub (if credentials provided)
        if: steps.check_dockerhub_creds.outputs.has_creds == 'true' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/smartcampus:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/smartcampus:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================
  # STAGE 3: CONTINUOUS DEPLOYMENT (CD)
  # ============================================================
  deploy:
    name: Continuous Deployment Trigger
    runs-on: ubuntu-latest
    needs: [test, docker]

    steps:
      - name: Check deployment configuration & secrets
        id: check_deploy
        run: |
          echo "### 🚀 Continuous Deployment Readiness" >> $GITHUB_STEP_SUMMARY
          if [ -n "${{ secrets.DEPLOY_WEBHOOK_URL }}" ]; then
            echo "has_webhook=true" >> $GITHUB_OUTPUT
            echo "✅ DEPLOY_WEBHOOK_URL secret detected." >> $GITHUB_STEP_SUMMARY
          else
            echo "has_webhook=false" >> $GITHUB_OUTPUT
            echo "ℹ️ DEPLOY_WEBHOOK_URL is not yet configured in GitHub Secrets (CD ready pending platform webhook)." >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "is_main=true" >> $GITHUB_OUTPUT
            echo "- **Target Branch:** \`main\` (Production Deployment Target)" >> $GITHUB_STEP_SUMMARY
          else
            echo "is_main=false" >> $GITHUB_OUTPUT
            echo "- **Current Branch:** \`${{ github.ref_name }}\` (Staging / Feature Branch)" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Execute Live Deployment (Production on 'main')
        if: steps.check_deploy.outputs.has_webhook == 'true' && steps.check_deploy.outputs.is_main == 'true'
        run: |
          echo "🚀 Triggering production deployment webhook..."
          HTTP_STATUS=$(curl -s -o response.txt -w "%{http_code}" -X POST "${{ secrets.DEPLOY_WEBHOOK_URL }}")
          echo "Webhook response HTTP status: $HTTP_STATUS"
          cat response.txt
          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "✅ Live deployment webhook triggered successfully!"
          else
            echo "❌ Deployment webhook returned error HTTP status: $HTTP_STATUS"
            exit 1
          fi

      - name: Deployment Simulation & Readiness Verification
        if: steps.check_deploy.outputs.has_webhook != 'true' || steps.check_deploy.outputs.is_main != 'true'
        run: |
          echo "================================================================="
          echo "🚀 SMARTCAMPUS CONTINUOUS DEPLOYMENT (CD) PIPELINE VERIFICATION"
          echo "================================================================="
          echo "✓ Matrix Tests (Python 3.10 & 3.11): Passed"
          echo "✓ Docker Container Build & Local Healthcheck: Passed"
          echo "✓ Streamlit Core Endpoint (/_stcore/health): Verified Healthy"
          echo ""
          if [ "${{ steps.check_deploy.outputs.is_main }}" != "true" ]; then
            echo "ℹ️ Pipeline executed on branch '${{ github.ref_name }}'."
            echo "   Production deployment trigger is active upon merge into 'main'."
          fi
          if [ "${{ steps.check_deploy.outputs.has_webhook }}" != "true" ]; then
            echo "ℹ️ Configuration Guide for Automated Cloud Deployment:"
            echo "   1. Navigate to: GitHub Repo -> Settings -> Secrets and variables -> Actions"
            echo "   2. Click 'New repository secret'"
            echo "   3. Name: DEPLOY_WEBHOOK_URL"
            echo "   4. Value: <Your Render / Railway / Hugging Face Spaces Webhook URL>"
          fi
          echo "================================================================="
          echo "✅ CD Stage Completed: Deployment pipeline is healthy and operational."
